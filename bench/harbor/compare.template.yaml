jobs_dir: __SKEIN_JOBS__
n_attempts: 3
timeout_multiplier: 2.0
# 5 concurrent docker builds contend for the daemon; give the build room.
environment_build_timeout_multiplier: 4.0
n_concurrent_trials: 5
quiet: false
environment:
  type: docker
  force_build: true
  delete: true
  # Both agents run under identical resources, so the comparison is fair. 5
  # concurrent trials x 4 CPU oversubscribes the 16-CPU host slightly (the OCaml
  # build is CPU-bound); 5 x 5120 MB = 25.6 GB fits the 30 GB host. See
  # docs/bench_report.md §4.4.
  override_cpus: 4
  override_memory_mb: 5120
agents:
  # Skein: context is a projection of the IR (docs/concepts.md).
  - name: langgraph
    model_name: routerai/~deepseek/deepseek-v4-flash-latest
    kwargs:
      project_path: __SKEIN_PROJECT__
      graph: skein
      node_version: 22
      model_kwargs:
        model: "~deepseek/deepseek-v4-flash-latest"
        configuration:
          baseURL: "https://routerai.ru/api/v1"
      configurable:
        maxTurns: 60
        # The hard-task set: reason at high effort (the default is low).
        reasoningEffort: high
  # opencode: ordinary monotone message tape, the reference agent.
  - name: opencode
    model_name: routerai/~deepseek/deepseek-v4-flash-latest
    kwargs:
      # opencode's first-class reasoning knob (--variant); the model option
      # below is the equivalent declarative form.
      variant: high
      opencode_config:
        provider:
          routerai:
            npm: "@ai-sdk/openai-compatible"
            name: RouterAI
            options:
              baseURL: https://routerai.ru/api/v1
              apiKey: "__ROUTERAI_API_KEY__"
            models:
              "~deepseek/deepseek-v4-flash-latest":
                name: DeepSeek V4 Flash
                # Match Skein's reasoning effort (F1 in
                # docs/plans/engine_fixes_found.md: the reasoning toggle decides).
                options:
                  reasoningEffort: high
datasets:
  - name: terminal-bench
    version: "2.0"
    task_names:
      - fix-ocaml-gc
      - db-wal-recovery
      - custom-memory-heap-crash
