jobs_dir: __SKEIN_JOBS__
n_attempts: 2
timeout_multiplier: 2.0
n_concurrent_trials: 3
quiet: false
environment:
  type: docker
  force_build: true
  delete: true
  # The verifier rebuilds OCaml with `make -j4`; task.toml gives cpus=1, so -j4 ran as
  # -j1. Override the container resources for every task in the job (Harbor applies these
  # to task_env_config, docs/plans/engine_fixes_found.md P3.1). Values fit the host
  # (16 CPU, 30G) even at n_concurrent_trials: 3: 3x4 CPU and 3x6G.
  override_cpus: 4
  override_memory_mb: 6144
agents:
  - name: langgraph
    model_name: routerai/~deepseek/deepseek-v4-flash-latest
    kwargs:
      project_path: __SKEIN_PROJECT__
      graph: skein
      node_version: 22
      model_kwargs:
        model: "~deepseek/deepseek-v4-flash-latest"
        configuration:
          baseURL: "https://routerai.ru/api/v1"
      configurable:
        maxTurns: 60
datasets:
  - name: terminal-bench
    version: "2.0"
    task_names:
      - fix-ocaml-gc
      - db-wal-recovery
      - custom-memory-heap-crash
