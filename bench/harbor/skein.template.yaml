jobs_dir: __SKEIN_JOBS__
n_attempts: 3
timeout_multiplier: 2.0
# 5 concurrent docker builds contend for the daemon; give the build room.
environment_build_timeout_multiplier: 4.0
n_concurrent_trials: 5
quiet: false
environment:
  type: docker
  force_build: true
  delete: true
  # Match bench/harbor/compare.template.yaml so a Skein-only run is comparable with the
  # opencode half of docs/benches/bench_report.md §4.4. The verifier rebuilds OCaml with
  # `make -j4`; task.toml gives cpus=1, so -j4 ran as -j1. Override the container
  # resources for every task in the job (Harbor applies these to task_env_config,
  # docs/benches/engine_fixes_found.md P3.1). 5x4 CPU oversubscribes the 16-CPU host
  # slightly; 5x5120 MB fits the 30 GB host.
  override_cpus: 4
  override_memory_mb: 5120
agents:
  - name: langgraph
    model_name: routerai/~deepseek/deepseek-v4-flash-latest
    kwargs:
      project_path: __SKEIN_PROJECT__
      graph: skein
      node_version: 22
      model_kwargs:
        model: "~deepseek/deepseek-v4-flash-latest"
        configuration:
          baseURL: "https://routerai.ru/api/v1"
      configurable:
        maxTurns: 60
        # Match the §4.4 baseline (both agents at high on the long terminal-bench tasks).
        reasoningEffort: high
datasets:
  - name: terminal-bench
    version: "2.0"
    task_names:
      - fix-ocaml-gc
      - db-wal-recovery
      - custom-memory-heap-crash
